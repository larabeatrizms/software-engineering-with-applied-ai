name: Playwright

on:
  workflow_dispatch:
  push:
    paths:
      - "module01/example-06-playwright-tests/**"
      - ".github/workflows/playwright.yml"
  pull_request:
    paths:
      - "module01/example-06-playwright-tests/**"
      - ".github/workflows/playwright.yml"

defaults:
  run:
    working-directory: module01/example-06-playwright-tests

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: module01/example-06-playwright-tests/package-lock.json

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: module01/example-06-playwright-tests/playwright-report/
          retention-days: 7
